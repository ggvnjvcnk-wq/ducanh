<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác thực OTP thất bại</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #ffebeb;
        }
        .otp-box {
            text-align: center;
            padding: 20px;
            border: 2px solid #f44336;
            border-radius: 8px;
            background-color: white;
        }
        .otp-fail {
            color: #f44336;
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        .home-button {
            padding: 10px 20px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-size: 1em;
        }
    </style>
</head>
<body>
    <div class="otp-box">
        <h1 class="otp-fail">Xác thực OTP thất bại!</h1>
        <a href="/" class="home-button">Quay trở lại trang chủ</a>
    </div>
</body>
</html>
